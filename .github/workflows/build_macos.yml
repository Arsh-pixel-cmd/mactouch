name: Build macOS Desktop App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Unit & Widget Tests
        run: flutter test

      - name: Build Native macOS App
        run: flutter build macos --release

      # upload-artifact v4 automatically zips directories natively for macOS Archive Utility
      - name: Upload macOS App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: MacTouch-macOS-App
          path: build/macos/Build/Products/Release/mactouch.app
          retention-days: 14
